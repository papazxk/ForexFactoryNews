name: Fetch ForexFactory
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download calendar
        run: |
          curl -fsSL --retry 3 --retry-delay 20 \
            -A "Mozilla/5.0" \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            -o ff_calendar.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ff_calendar.json
          git diff --staged --quiet || (git commit -m "update calendar" && git push)
